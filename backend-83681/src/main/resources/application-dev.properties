spring.application.name=clinica

server.port=8080
server.tomcat.max-threads=32
server.servlet.contextPath=/clinica/v1

#Conexion BD (se puede sobrescribir con las variables DB_URL, DB_USERNAME y DB_PASSWORD)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/clinica?zeroDateTimeBehavior=convertToNull&serverTimezone=America/Bogota&useSSL=false&zeroDateTimeBehavior=round}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#Incluye errores dentro de las respuestas http
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false